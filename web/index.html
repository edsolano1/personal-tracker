<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0E1411; --surface:#161F1A; --line:#26322B; --fg:#E5EDE8; --muted:#90A097;
  --money:#55C48D; --food:#F08A3C; --protein:#E85D75; --today:#6B9BF2; --bad:#F07A70;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.view{min-height:100vh;padding:24px 16px 32px;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.view.pop{animation:pop .5s cubic-bezier(.34,1.45,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.22,1.2,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.eyebrow{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 30px var(--display);font-variation-settings:"wdth" 105;margin:2px 0 6px;letter-spacing:-.01em}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:28px;border:1px solid var(--line);
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 30%,var(--surface)),var(--surface) 70%);color:inherit;text-align:left;font:inherit;width:100%;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.card:active{transform:scale(.96)}
.head{display:flex;align-items:center;gap:12px}
.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.icon svg{width:20px;height:20px}
.head b{font:700 18px var(--body)}
.head .go{margin-left:auto;color:var(--c);font-size:26px;line-height:1}
.big{font:800 64px/1 var(--display);font-variation-settings:"wdth" 118;letter-spacing:-.02em;color:var(--money);font-variant-numeric:tabular-nums}
.big.bad{color:var(--bad)}
.sub{color:var(--muted)} .sub.bad{color:var(--bad)}
.meter .top{display:flex;align-items:baseline;gap:4px;font-size:14px;color:var(--muted)}
.meter .top b{margin-left:auto;color:var(--fg);font-size:16px}
.track{height:10px;border-radius:99px;background:color-mix(in srgb,var(--m) 16%,transparent);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--m);transition:width .9s cubic-bezier(.22,1,.36,1)}
.ev{display:flex;align-items:center;gap:10px}
.ev .t{width:70px;flex:none;color:var(--today);font-weight:600;font-size:14px}
.ev .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:600 11px var(--body);color:var(--today);background:color-mix(in srgb,var(--today) 16%,transparent);padding:2px 8px;border-radius:99px;flex:none}
.muted{color:var(--muted)} .small{font-size:12.5px}
.version{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
.back{align-self:flex-start;background:none;border:0;color:var(--c,var(--today));font:600 15px var(--body);padding:4px 0;cursor:pointer}
/* Today */
.hero{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:26px;background:linear-gradient(140deg,color-mix(in srgb,var(--today) 40%,var(--surface)),var(--surface) 75%)}
.hero .label{font:700 12px var(--body);letter-spacing:.12em;color:var(--today)}
.hero .title{font:700 24px var(--body)}
.section{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 0 4px}
.allday{display:flex;align-items:center;gap:8px;padding:14px;border-radius:16px;background:var(--surface);font-weight:600}
.allday>span:first-child{flex:1}
.tl{display:flex;gap:0}
.tl .time{width:66px;flex:none;padding-top:1px}
.tl .time b{display:block;color:var(--today);font-size:14px} .tl .time span{font-size:12px;color:var(--muted)}
.tl .rail{width:20px;flex:none;display:flex;flex-direction:column;align-items:center}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--today);margin-top:6px}
.tl.live .dot{width:12px;height:12px;box-shadow:0 0 0 5px color-mix(in srgb,var(--today) 25%,transparent)}
.tl .line{width:2px;flex:1;background:var(--line);margin-top:4px}
.tl .body{flex:1;min-width:0;padding:0 0 20px 8px}
.tl .body b{display:block;font-size:16px}
.tl .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.tl.past{opacity:.45} .tl.past .dot{background:var(--muted)}
.plan{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface)}
.plan input{width:22px;height:22px;accent-color:var(--today)}
.links{display:flex;gap:18px;flex-wrap:wrap}
.links button{background:none;border:0;color:var(--today);font:600 14px var(--body);padding:6px 0}
/* Money */
/* vh can read as 0 inside the app's WebView, so Money fills the window with fixed positioning instead. */
#v-money{position:fixed;inset:0;padding:0;max-width:none;min-height:0;gap:0}
#v-money iframe{border:0;width:100%;flex:1;min-height:0;display:block;background:var(--bg)}
/* Home sits in a slim bar across the top, out of the way of the wallet's own buttons and pop-ups (Nov 21). */
#v-money .back{flex:none;align-self:stretch;text-align:left;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--bg);border-bottom:1px solid var(--line);color:var(--money);font-size:14px}
.msg{padding:14px 16px;border-radius:14px;background:#3A2C14;font-size:14px}
/* Opening a section: its color bursts out of the card, its icon springs in, sparks fly, then the page shows. */
.burst{position:fixed;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center;
  background:radial-gradient(circle at var(--x) var(--y),color-mix(in srgb,var(--c) 70%,#000) 0,color-mix(in srgb,var(--c) 22%,var(--bg)) 70%);
  clip-path:circle(0 at var(--x) var(--y));animation:reveal .34s cubic-bezier(.4,0,.2,1) forwards}
.burst.out{animation:reveal .34s cubic-bezier(.4,0,.2,1) forwards,fadeaway .26s ease forwards}
@keyframes reveal{to{clip-path:circle(150% at var(--x) var(--y))}}
@keyframes fadeaway{to{opacity:0;transform:scale(1.06)}}
.burst .ic{position:relative;width:110px;height:110px;color:#fff;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
.burst .ic svg{width:100%;height:100%}
.fx-money .ic{animation:coin .6s cubic-bezier(.34,1.56,.64,1) .05s both}
@keyframes coin{from{transform:scale(.2) rotateY(720deg);opacity:0}to{transform:none;opacity:1}}
.fx-today .ic{animation:sunrise .6s cubic-bezier(.34,1.56,.64,1) .05s both}
@keyframes sunrise{from{transform:translateY(60px) scale(.3) rotate(-160deg);opacity:0}to{transform:none;opacity:1}}
.fx-today .ray{transform-origin:12px 12px;animation:rays .7s ease-out .15s both}
@keyframes rays{from{transform:rotate(-90deg) scale(.4);opacity:0}}
.fx-food .ic{animation:beat .62s ease .05s both}
@keyframes beat{0%{transform:scale(.2);opacity:0}45%{transform:scale(1.18);opacity:1}65%{transform:scale(.94)}82%{transform:scale(1.05)}100%{transform:scale(1)}}
.burst .spark{position:absolute;left:50%;top:50%;width:var(--s,10px);height:var(--s,10px);margin:calc(var(--s,10px)/-2);border-radius:50%;background:var(--k);opacity:0;
  animation:fly .62s cubic-bezier(.2,.8,.3,1) var(--d,.12s) both}
.fx-money .spark{border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.fx-today .spark{border-radius:2px}
@keyframes fly{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--r,130px) * -1)) scale(.3)}}
@media (prefers-reduced-motion:reduce){.burst{display:none}}
/* The Claude button floats on every page and opens his chat with Claude. */
#claude{position:fixed;right:16px;bottom:18px;z-index:5;width:50px;height:50px;border-radius:50%;border:0;display:grid;place-items:center;
  background:#D97757;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
#claude:active{transform:scale(.9)}
#claude-tip{position:fixed;right:16px;bottom:78px;z-index:5;max-width:260px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
</style>
</head>
<body>

<main class="view" id="v-home" data-view="">
  <div class="intro">
    <div class="eyebrow" id="h-date"></div>
    <h1 id="h-hello">Hello, Eddie</h1>
  </div>
  <div class="msg" id="h-msg" hidden></div>
  <button class="card intro" style="--c:var(--money)" data-go="money">
    <div class="head"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 13h2M2 10h20"/></svg></span><b>Money</b><span class="go">›</span></div>
    <div class="big" id="h-big">$—</div>
    <div class="sub" id="h-sub">Left until payday</div>
  </button>
  <button class="card intro" style="--c:var(--food)" data-native="food">
    <div class="head"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-11a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 6.5-7 11-7 11z"/></svg></span><b>Food</b><span class="go">›</span></div>
    <div class="meter" style="--m:var(--food)"><div class="top">Calories <b id="h-cal">0</b><span id="h-calt"></span></div><div class="track"><i id="h-calb"></i></div></div>
    <div class="meter" style="--m:var(--protein)"><div class="top">Protein <b id="h-pro">0</b><span id="h-prot"></span></div><div class="track"><i id="h-prob"></i></div></div>
  </button>
  <button class="card intro" style="--c:var(--today)" data-go="today">
    <div class="head"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span><b>Today</b><span class="go">›</span></div>
    <div id="h-events" style="display:flex;flex-direction:column;gap:8px"></div>
  </button>
  <div class="version" id="h-ver"></div>
</main>

<main class="view" id="v-today" data-view="today" hidden style="--c:var(--today)">
  <button class="back" data-back>‹ Home</button>
  <div>
    <div class="eyebrow" id="t-day" style="color:var(--today)"></div>
    <h1 id="t-date"></h1>
    <div class="muted" id="t-count"></div>
  </div>
  <div class="hero" id="t-hero" hidden>
    <div class="label" id="t-hlabel"></div>
    <div class="title" id="t-htitle"></div>
    <div class="muted" id="t-hwhen"></div>
  </div>
  <div id="t-allday"></div>
  <div id="t-schedule"></div>
  <div id="t-plan"></div>
  <div>
    <div class="muted small" id="t-fresh"></div>
    <div class="links">
      <button data-native="refresh">Refresh calendar</button>
      <button data-native="link">iCal link</button>
      <button data-native="raw">Raw events</button>
    </div>
  </div>
</main>

<main class="view" id="v-money" data-view="money" hidden>
  <button class="back" data-back>‹ Home</button>
  <iframe id="m-frame" title="Wallet"></iframe>
</main>

<button id="claude" aria-label="Talk to Claude"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 3.5c-4.97 0-9 3.36-9 7.5 0 2.3 1.24 4.36 3.2 5.73L5.5 20.5l4.12-2.26c.77.17 1.57.26 2.38.26 4.97 0 9-3.36 9-7.5s-4.03-7.5-9-7.5z" fill="currentColor"/><circle cx="8.2" cy="11" r="1.25" fill="#D97757"/><circle cx="12" cy="11" r="1.25" fill="#D97757"/><circle cx="15.8" cy="11" r="1.25" fill="#D97757"/></svg></button>
<div id="claude-tip" hidden></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const App=window.App;
  const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
  const time=ms=>new Date(ms).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  const until=ms=>{const m=Math.round(ms/60000);if(m<1)return"now";if(m<60)return`in ${m} min`;const h=Math.floor(m/60),r=m%60;return`in ${h} hr${r?` ${r} min`:""}`};
  let S=null;

  function load(){
    if(!App){$("h-msg").hidden=false;$("h-msg").textContent="Open this in the Tracker app to see your calendar and food.";return}
    try{S=JSON.parse(App.snapshot())}catch(e){return}
    render();
  }

  function render(){
    const now=Date.now(), d=new Date(S.date+"T12:00");
    const h=new Date().getHours();
    $("h-date").textContent=d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
    $("h-hello").textContent=(h<12?"Good morning":h<17?"Good afternoon":"Good evening")+", Eddie";
    // Money
    const w=S.wallet, out=(w.eyebrow||"").startsWith("Out");
    $("h-big").textContent=w.big||"$—";$("h-big").className="big"+(out?" bad":"");
    $("h-sub").textContent=!w.big?"Open to load your wallet":(w.pill||w.eyebrow||"Left until payday");
    $("h-sub").className="sub"+(out?" bad":"");
    // Food
    const f=S.food;
    $("h-cal").textContent=f.calories.toLocaleString();$("h-calt").textContent="/ "+f.calorieTarget.toLocaleString();
    $("h-pro").textContent=f.protein;$("h-prot").textContent="/ "+f.proteinTarget+"g";
    requestAnimationFrame(()=>{$("h-calb").style.width=Math.min(100,f.calories/f.calorieTarget*100)+"%";$("h-prob").style.width=Math.min(100,f.protein/f.proteinTarget*100)+"%"});
    // Today card
    const evs=S.events.filter(e=>e.allDay||e.end>now).slice(0,4), box=$("h-events");box.innerHTML="";
    if(!S.calendar)box.appendChild(el("div","muted","Allow calendar access to see your day"));
    else if(!evs.length)box.appendChild(el("div","muted","Nothing else on the calendar today"));
    evs.forEach(e=>{const r=el("div","ev");r.append(el("span","t",e.allDay?"All day":time(e.begin)),el("span","n",e.title));if(e.shared)r.append(el("span","tag","Shared"));box.appendChild(r)});
    $("h-ver").textContent="Version "+App.version();
    renderToday(now,d);
  }

  function renderToday(now,d){
    $("t-day").textContent=d.toLocaleDateString("en-US",{weekday:"long"}).toUpperCase();
    $("t-date").textContent=d.toLocaleDateString("en-US",{month:"long",day:"numeric"});
    const timed=S.events.filter(e=>!e.allDay), allDay=S.events.filter(e=>e.allDay);
    $("t-count").textContent=S.events.length?`${timed.filter(e=>e.end>now).length} still to go · ${S.events.length} today`:"Nothing on your calendars today";
    const cur=timed.find(e=>e.begin<=now&&e.end>now), next=timed.find(e=>e.begin>now), hero=cur||next;
    $("t-hero").hidden=!hero;
    if(hero){$("t-hlabel").textContent=cur?"HAPPENING NOW":"UP NEXT";$("t-htitle").textContent=hero.title;
      $("t-hwhen").textContent=`${time(hero.begin)} – ${time(hero.end)} · ${cur?"ends "+until(hero.end-now):until(hero.begin-now)}`}
    const ad=$("t-allday");ad.innerHTML="";
    if(allDay.length){ad.append(el("div","section","All day"));allDay.forEach(e=>{const r=el("div","allday");r.append(el("span",null,e.title));if(e.shared)r.append(el("span","tag","Shared"));ad.append(r)})}
    const sc=$("t-schedule");sc.innerHTML="";
    if(timed.length)sc.append(el("div","section","Schedule"));
    timed.forEach((e,i)=>{
      const past=e.end<=now, live=e.begin<=now&&e.end>now;
      const r=el("div","tl"+(past?" past":"")+(live?" live":""));
      const t=el("div","time");t.append(el("b",null,time(e.begin)),el("span",null,time(e.end)));
      const rail=el("div","rail");rail.append(el("i","dot"));if(i<timed.length-1)rail.append(el("i","line"));
      const b=el("div","body");b.append(el("b",null,e.title));
      const m=el("div","meta");m.append(el("span",null,live?"Now · ends "+until(e.end-now):past?"Done":until(e.begin-now)));if(e.shared)m.append(el("span","tag","Shared"));
      b.append(m);r.append(t,rail,b);sc.append(r)});
    const pl=$("t-plan");pl.innerHTML="";
    const tasks=S.plan.filter(p=>!p.food);
    if(tasks.length){pl.append(el("div","section","Plan"));tasks.forEach(p=>{
      const r=el("label","plan");const c=document.createElement("input");c.type="checkbox";c.checked=p.done;
      c.onchange=()=>App.toggle(p.key,c.checked);
      const s=el("div");s.style.flex="1";s.append(el("div",null,p.name),el("div","muted small",time(p.begin)+" · "+p.type));
      r.append(c,s);pl.append(r)})}
    $("t-fresh").textContent=S.refreshing?"Checking Google…":S.freshness;
  }

  // Views: home, today, money. Each section pops in; going back shows home as it was.
  let first=true;
  function show(){
    const v=location.hash.replace(/^#/,"");
    const target=["today","money"].includes(v)?v:"";
    document.querySelectorAll("[data-view]").forEach(e=>{
      const on=e.dataset.view===target;
      if(on&&e.hidden){e.hidden=false;if(target){e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}}
      else if(!on)e.hidden=true;
    });
    if(target==="money"&&App&&!$("m-frame").src)$("m-frame").src=App.walletUrl();
    if(!target&&first){first=false;document.querySelectorAll(".intro").forEach((e,i)=>{e.classList.add("rise");e.style.animationDelay=i*70+"ms"})}
    scrollTo(0,0);
  }
  window.go=v=>{if(location.hash.replace("#","")!==v)location.hash=v};

  // Section bursts: about 0.6s, and the page underneath switches while it plays.
  const ICONS={
    money:{c:"var(--money)",k:["#FFE08A","#FFF4C2","#55C48D"],svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" fill="rgba(255,255,255,.14)"/><circle cx="12" cy="12" r="7.2" stroke-opacity=".5"/><path d="M14.6 9.3c-.5-.9-1.5-1.4-2.6-1.4-1.5 0-2.6.8-2.6 2s1.1 1.6 2.6 2 2.7.8 2.7 2.1-1.2 2-2.7 2c-1.2 0-2.2-.5-2.7-1.4M12 6.4v1.5M12 16.2v1.4"/></svg>`},
    today:{c:"var(--today)",k:["#FFFFFF","#CFE0FF","#FFD27A"],svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g class="ray"><path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></g><circle cx="12" cy="12" r="5.2" fill="rgba(255,255,255,.18)"/><path d="M9.6 12.1l1.6 1.6 3.3-3.3"/></svg>`},
    food:{c:"var(--food)",k:["#FFD0A8","#FF8FA3","#FFFFFF"],svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-11a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 6.5-7 11-7 11z" fill="rgba(255,255,255,.18)"/><path d="M9.5 10.5v2.2a1.4 1.4 0 0 0 2.8 0v-2.2M10.9 13.6V16M14.5 10.5v5.5M14.5 10.5c1 .3 1.4 1.3 1.4 2.4h-1.4"/></svg>`},
  };
  const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function burst(kind,card,ev,then){
    const k=ICONS[kind];
    if(calm||!k){then();return}
    const r=card.getBoundingClientRect(), x=ev&&ev.clientX?ev.clientX:r.left+r.width/2, y=ev&&ev.clientY?ev.clientY:r.top+r.height/2;
    const o=el("div","burst fx-"+kind);o.style.setProperty("--c",k.c);o.style.setProperty("--x",x+"px");o.style.setProperty("--y",y+"px");
    const ic=el("div","ic");ic.innerHTML=k.svg;o.append(ic);
    for(let i=0;i<14;i++){const sp=el("i","spark");sp.style.setProperty("--a",(i*360/14+Math.random()*14)+"deg");
      sp.style.setProperty("--k",k.k[i%k.k.length]);sp.style.setProperty("--r",(110+Math.random()*90)+"px");
      sp.style.setProperty("--s",(6+Math.random()*8)+"px");sp.style.setProperty("--d",(.1+Math.random()*.12)+"s");o.append(sp)}
    document.body.append(o);
    setTimeout(then,330);
    setTimeout(()=>o.classList.add("out"),560);
    setTimeout(()=>o.remove(),850);
  }
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=e=>{const v=b.dataset.go;b.classList.contains("card")?burst(v,b,e,()=>go(v)):go(v)});
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>history.back());
  document.querySelectorAll("[data-native]").forEach(b=>b.onclick=e=>{if(!App)return;const n=b.dataset.native;
    if(n==="refresh")App.refresh();else if(b.classList.contains("card"))burst(n,b,e,()=>App.open(n));else App.open(n)});
  // Tap: the in-app chat panel (App & money / Shopping), which remembers each chat itself.
  // Older app versions without the panel fall back to opening claude.ai outside the app.
  (function(){
    const b=$("claude"), tip=$("claude-tip");
    const say=t=>{tip.textContent=t;tip.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>tip.hidden=true,4000)};
    b.onclick=()=>{
      if(App&&App.openChat)App.openChat("");
      else if(App&&App.openUrl)App.openUrl("https://claude.ai/code");
      else say("This button needs the latest Tracker app. Close and reopen the app to update it.")};
  })();
  addEventListener("hashchange",show);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
  show();load();setInterval(load,4000);
})();
</script>
</body>
</html>
