<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Money</title>
<style>
:root{--bg:#0E1411;--surface:#161F1A;--line:#26322B;--fg:#E5EDE8;--muted:#90A097;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
/* Finance only (Nov 24): the wallet is the whole app. vh can read as 0 inside the app's WebView,
   so the wallet fills the window with fixed positioning instead. */
#m-frame{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:var(--bg)}
.msg{position:fixed;left:16px;right:16px;top:calc(16px + env(safe-area-inset-top));padding:14px 16px;border-radius:14px;background:#3A2C14;font-size:14px}
/* The Claude button floats over the wallet and opens his chat with Claude. */
#claude{position:fixed;right:16px;bottom:18px;z-index:5;width:50px;height:50px;border-radius:50%;border:0;display:grid;place-items:center;
  background:#D97757;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;transition:transform .15s}
#claude:active{transform:scale(.9)}
#claude-tip{position:fixed;right:16px;bottom:78px;z-index:5;max-width:260px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
</style>
</head>
<body>
<iframe id="m-frame" title="Wallet"></iframe>
<div class="msg" id="msg" hidden>Open this in the Tracker app to see your wallet.</div>
<button id="claude" aria-label="Talk to Claude"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 3.5c-4.97 0-9 3.36-9 7.5 0 2.3 1.24 4.36 3.2 5.73L5.5 20.5l4.12-2.26c.77.17 1.57.26 2.38.26 4.97 0 9-3.36 9-7.5s-4.03-7.5-9-7.5z" fill="currentColor"/><circle cx="8.2" cy="11" r="1.25" fill="#D97757"/><circle cx="12" cy="11" r="1.25" fill="#D97757"/><circle cx="15.8" cy="11" r="1.25" fill="#D97757"/></svg></button>
<div id="claude-tip" hidden></div>
<script>
(function(){
  const $=id=>document.getElementById(id), App=window.App;
  if(App&&App.walletUrl)$("m-frame").src=App.walletUrl();else $("msg").hidden=false;
  // Older app versions call go('money') or go('today'); there's only the wallet now.
  window.go=()=>{};
  // Tap: the in-app chat panel (App & money / Shopping), which remembers each chat itself.
  const b=$("claude"), tip=$("claude-tip");
  const say=t=>{tip.textContent=t;tip.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>tip.hidden=true,4000)};
  b.onclick=()=>{
    if(App&&App.openChat)App.openChat("");
    else if(App&&App.openUrl)App.openUrl("https://claude.ai/code");
    else say("This button needs the latest Tracker app. Close and reopen the app to update it.")};
})();
</script>
</body>
</html>
